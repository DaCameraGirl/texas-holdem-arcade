<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texas Hold'em - Retro Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0a;
    color:#e8e8e8;
    font-family:'Press Start 2P', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
  }
  #game-wrap {
    width:960px;
    max-width:100vw;
  }
  #canvas-holder {
    position:relative;
    background:#143a1a;
    border:4px solid #d4af37;
    border-radius:16px;
    box-shadow:0 0 30px rgba(212,175,55,0.3), inset 0 0 80px rgba(0,0,0,0.5);
  }
  canvas { display:block; border-radius:12px; }
  #ui-bar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    background:#111;
    border:3px solid #d4af37;
    border-radius:10px;
    margin-top:8px;
    font-size:10px;
    gap:12px;
    flex-wrap:wrap;
  }
  #ui-bar span { color:#d4af37; }
  #controls {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  button {
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    padding:10px 14px;
    background:#1e1e1e;
    color:#e8e8e8;
    border:2px solid #d4af37;
    border-radius:6px;
    cursor:pointer;
  }
  button:hover:not(:disabled) { background:#2a2a2a; box-shadow:0 0 10px rgba(212,175,55,0.4); }
  button:disabled { opacity:0.35; cursor:not-allowed; }
  #bet-input {
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    padding:9px;
    width:90px;
    background:#0a0a0a;
    color:#e8e8e8;
    border:2px solid #d4af37;
    border-radius:6px;
    text-align:right;
  }
  #msg {
    font-size:9px;
    color:#ffcc66;
    min-height:16px;
  }
  #hand-rank {
    font-size:11px;
    font-weight:bold;
    min-height:18px;
    text-shadow: 0 0 8px currentColor;
  }
  #hand-rank.rank-0 { color:#aaa; }
  #hand-rank.rank-1 { color:#7fff7f; }
  #hand-rank.rank-2 { color:#7fff7f; }
  #hand-rank.rank-3 { color:#7fff7f; }
  #hand-rank.rank-4 { color:#66ccff; }
  #hand-rank.rank-5 { color:#66ccff; }
  #hand-rank.rank-6 { color:#cc88ff; }
  #hand-rank.rank-7 { color:#ffaa44; }
  #hand-rank.rank-8 { color:#ffd700; text-shadow: 0 0 12px #ffd700; animation: pulse-gold 0.8s infinite alternate; }
  @keyframes pulse-gold { from { opacity:0.85; } to { opacity:1; } }
  #slider-wrap { display:flex; align-items:center; gap:6px; }
  input[type=range] { width:120px; accent-color:#d4af37; }

  /* winner banner */
  #winner-banner {
    position:absolute;
    left:50%; top:44%;
    transform:translate(-50%,-50%);
    background:rgba(10,10,10,0.92);
    border:3px solid #d4af37;
    border-radius:12px;
    padding:18px 28px;
    text-align:center;
    font-size:12px;
    color:#fffacd;
    box-shadow:0 0 30px rgba(212,175,55,0.5);
    display:none;
    pointer-events:none;
    z-index:5;
    line-height:1.9;
  }
  #winner-banner small { font-size:8px; color:#7fff7f; display:block; margin-top:4px;}
</style>
</head>
